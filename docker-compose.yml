version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DELPHI_ENV=development
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./config:/app/config

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: delphi_password
      POSTGRES_DB: delphi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
