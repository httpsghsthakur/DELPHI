services:
  - type: web
    name: delphi-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn delphi.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DELPHI_EXECUTION_MODE
        value: REAL
      - key: STRICT_TEMPORAL_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///delphi.db
      - key: CORS_ORIGINS
        value: "*"
